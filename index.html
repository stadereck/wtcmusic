<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página Básica</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: black;
            color: white;
            padding: 20px;
        }

        main {
            padding: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <h1>Mi Página Web</h1>
</header>

<main>
    <h2>Bienvenido</h2>
    <p>Este es un sitio HTML básico.</p>

    <button onclick="saludar()">Haz clic</button>
</main>

<script>
function saludar() {
    alert("Hola mundo");
}
</script>

</body>
</html>
