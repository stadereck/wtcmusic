<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        .player-container {
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            background: white;
            width: 400px;
            position: relative;
        }
        video {
            width: 100%;
            height: auto;
            position: absolute;
            top: 0;
            left: 0;
            object-fit: cover;
            z-index: 0;
        }
        .controls {
            position: relative;
            z-index: 1;
            padding: 20px;
        }
        .progress {
            width: 100%;
            height: 5px;
            background-color: #ddd;
            border-radius: 5px;
            margin: 10px 0;
        }
        .progress-bar {
            height: 100%;
            background-color: #007bff;
            width: 0;
        }
        .play-pause,
        .rewind,
        .forward {
            cursor: pointer;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            margin: 0 5px;
        }
    </style>
</head>
<body>
    <div class="player-container">
        <video id="videoCover" src="https://res.cloudinary.com/dhx58lnzb/video/upload/v1772248124/Dancing_Golem_aauqpk.mp4" autoplay muted loop></video>
        <div class="controls">
            <h2>Sam Gellaitry</h2>
            <p>Duration: 3:40</p>
            <audio id="audio" src="https://res.cloudinary.com/dhx58lnzb/video/upload/v1771900933/Assumptions_mhq8co.mp3"></audio>
            <button class="rewind">⏪ Rewind</button>
            <button class="play-pause">▶️ Play</button>
            <button class="forward">⏩ Forward</button>
            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <input type="range" id="volumeControl" min="0" max="1" step="0.1" value="1">
        </div>
    </div>

    <script>
        const audio = document.getElementById('audio');
        const playPauseBtn = document.querySelector('.play-pause');
        const rewindBtn = document.querySelector('.rewind');
        const forwardBtn = document.querySelector('.forward');
        const progressBar = document.getElementById('progressBar');
        const volumeControl = document.getElementById('volumeControl');

        playPauseBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playPauseBtn.textContent = '⏸️ Pause';
            } else {
                audio.pause();
                playPauseBtn.textContent = '▶️ Play';
            }
        });

        rewindBtn.addEventListener('click', () => {
            audio.currentTime = Math.max(0, audio.currentTime - 10);
        });

        forwardBtn.addEventListener('click', () => {
            audio.currentTime = Math.min(audio.duration, audio.currentTime + 10);
        });

        audio.addEventListener('timeupdate', () => {
            const progressPercent = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = `${progressPercent}%`;
        });

        volumeControl.addEventListener('input', () => {
            audio.volume = volumeControl.value;
        });
    </script>
</body>
</html>
