playsinline

style="filter:blur(80px);">

<div class="absolute inset-0 bg-black/30 bg-gradient-to-b from-transparent to-black/60"></div>

</div>


<div class="relative z-10 w-full pt-4 pb-2 px-6 flex justify-between items-center text-white/90 text-xs font-semibold">

<span>9:41</span>

<div class="flex gap-2 items-center">
<div class="w-4 h-3 bg-white/90 rounded-sm"></div>
<div class="w-5 h-3 bg-white/90 rounded-sm"></div>
</div>

</div>


<div class="absolute top-2 left-1/2 -translate-x-1/2 w-32 h-7 bg-black rounded-full z-20"></div>


<div class="relative z-10 flex-1 flex flex-col px-6 pt-6 pb-8">


<div id="coverContainer" class="relative w-full aspect-square rounded-[2rem] overflow-hidden shadow-[0_20px_50px_rgba(0,0,0,0.5)] transition-transform duration-500 scale-90">

loop
muted
autoplay
playsinline
class="w-full h-full object-cover">
</video>

</div>


<div class="flex-1"></div>


<div class="flex justify-between items-end mb-8 mt-6">

<div>

<div class="flex items-center gap-2 mb-2 bg-white/10 w-max px-3 py-1 rounded-full backdrop-blur-md">

<div class="w-4 h-4 bg-gradient-to-tr from-purple-500 to-orange-400 rounded-full"></div>

Escuchando ahora

</button>

<button class="text-white/80 bg-white/5 p-2 rounded-full backdrop-blur-sm">
<i data-lucide="more-horizontal" class="w-5 h-5"></i>
</button>

</div>

<div class="mb-8 progress-container group cursor-pointer">

id="progressBar"
min="0"
max="100"

0:00

</button>

<i id="pauseIcon" data-lucide="pause" class="w-14 h-14 fill-current text-white hidden"></i>

</button>


<button id="btnForward">
<i data-lucide="fast-forward" class="w-9 h-9 fill-current text-white"></i>

<div class="flex items-center gap-4 mb-8">

<i data-lucide="volume-1" class="w-3.5 h-3.5 text-white/50"></i>

id="volumeBar"
min="0"
max="1"
step="0.01"

<div class="w-full h-1.5 bg-white/20 rounded-full">

<div
id="volumeFill"
class="h-full bg-white/80 rounded-full"
style="width:80%;">
</div>

</div>


<div
id="volumeThumb"
class="volume-thumb absolute w-3 h-3 bg-white rounded-full shadow scale-0 transition-transform"
style="left:calc(80% - 6px);">
</div>

</div>

<i data-lucide="volume-2" class="w-4 h-4 text-white/50"></i>

</div>




<div class="flex justify-center gap-10">

<button class="text-white/20">
<i data-lucide="message-square-quote" class="w-5 h-5"></i>
</button>

<button class="text-white/60">
<i data-lucide="monitor-speaker" class="w-5 h-5"></i>
</button>

<button class="text-white/60">
<i data-lucide="list-music" class="w-5 h-5"></i>
</button>

</div>


</div>


<div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1 bg-white/50 rounded-full z-20"></div>

</div>



<audio
id="audioPlayer"
src="https://res.cloudinary.com/dhx58lnzb/video/upload/v1771900933/Assumptions_mhq8co.mp3">
</audio>



<script>

lucide.createIcons();

const audio=document.getElementById('audioPlayer');
const coverVideo=document.getElementById('coverVideo');
const bgVideo=document.getElementById('bgVideo');
const coverContainer=document.getElementById('coverContainer');

const btnPlayPause=document.getElementById('btnPlayPause');
const playIcon=document.getElementById('playIcon');
const pauseIcon=document.getElementById('pauseIcon');

const btnRewind=document.getElementById('btnRewind');
const btnForward=document.getElementById('btnForward');

const progressBar=document.getElementById('progressBar');
const progressFill=document.getElementById('progressFill');
const progressThumb=document.getElementById('progressThumb');

const currentTimeDisplay=document.getElementById('currentTimeDisplay');
const durationDisplay=document.getElementById('durationDisplay');

const volumeBar=document.getElementById('volumeBar');
const volumeFill=document.getElementById('volumeFill');
const volumeThumb=document.getElementById('volumeThumb');


let isPlaying=false;
let duration=0;


function formatTime(t){

if(!t)return"0:00";

let m=Math.floor(t/60);
let s=Math.floor(t%60);

return m+":"+String(s).padStart(2,"0");

}



function updatePlay(){

if(isPlaying){

audio.play();
coverVideo.play();
bgVideo.play();

playIcon.classList.add("hidden");
pauseIcon.classList.remove("hidden");

coverContainer.classList.remove("scale-90");
coverContainer.classList.add("scale-100");

}

else{

audio.pause();
coverVideo.pause();
bgVideo.pause();

playIcon.classList.remove("hidden");
pauseIcon.classList.add("hidden");

coverContainer.classList.add("scale-90");
coverContainer.classList.remove("scale-100");

}

}



btnPlayPause.onclick=()=>{

isPlaying=!isPlaying;

updatePlay();

};



btnForward.onclick=()=>{

audio.currentTime+=15;

};



btnRewind.onclick=()=>{

audio.currentTime-=15;

};



audio.onloadedmetadata=()=>{

duration=audio.duration;

progressBar.max=duration;

durationDisplay.textContent="-"+formatTime(duration);

};



audio.ontimeupdate=()=>{

let current=audio.currentTime;

progressBar.value=current;

let percent=duration?(current/duration)*100:0;

progressFill.style.width=percent+"%";

progressThumb.style.left=`calc(${percent}% - 4px)`;

currentTimeDisplay.textContent=formatTime(current);

durationDisplay.textContent="-"+formatTime(duration-current);

};



progressBar.oninput=(e)=>{

audio.currentTime=e.target.value;

};



volumeBar.oninput=(e)=>{

let v=e.target.value;

audio.volume=v;

let percent=v*100;

volumeFill.style.width=percent+"%";

volumeThumb.style.left=`calc(${percent}% - 6px)`;

};


audio.volume=0.8;


window.onload=()=>{

durationDisplay.textContent="-0:00";

};


</script>


</body>
</html>
