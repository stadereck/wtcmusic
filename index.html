<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reproductor web de WTC Music: música para todo el mundo</title>
    <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/7/75/Spotify_icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- ── TOP BAR ── -->
    <header class="topbar">
        <div class="top-left">
            <i class="fa-brands fa-spotify"></i>
        </div>

        <div class="top-center">
            <button class="btn-home" aria-label="Inicio"><i class="fa fa-house"></i></button>
            <div class="search-bar" id="searchBar">
                <i class="fa fa-magnifying-glass" aria-hidden="true"></i>
                <input type="text" id="searchInput" placeholder="¿Qué quieres reproducir?" aria-label="Buscar" autocomplete="off" />
                <i class="fa fa-xmark" id="searchClear" aria-hidden="true" style="display:none;cursor:pointer;"></i>
                <i class="fa fa-folder" aria-hidden="true"></i>
            </div>
            <div class="search-dropdown" id="searchDropdown" hidden>
                <div class="sd-nav">
                    <button class="sd-nav-btn" id="sdNavUp"   aria-label="Arriba"><i class="fa fa-arrow-up"></i></button>
                    <button class="sd-nav-btn" id="sdNavDown" aria-label="Abajo"> <i class="fa fa-arrow-down"></i></button>
                    <span class="sd-nav-label">Desplazarte</span>
                    <button class="sd-btn-intro">Intro</button>
                    <button class="sd-btn-buscar">Buscar</button>
                </div>
                <div id="sdList" role="listbox"></div>
            </div>
        </div>

        <div class="top-right">
            <button class="btn-install" aria-label="Instalar app">
                <i class="fa fa-circle-down"></i> Instalar app
            </button>
            <button class="icon-btn" aria-label="Notificaciones"><i class="fa fa-bell"></i></button>
            <button class="icon-btn" aria-label="Amigos"><i class="fa fa-users"></i></button>
            <div class="user-avatar" role="button" aria-label="Perfil de usuario">D</div>
        </div>
    </header>

    <!-- ── LEFT SIDEBAR ── -->
    <nav class="panel left-sidebar" aria-label="Biblioteca">
        <div class="lib-header">
            <div class="lib-title">
                <i class="fa fa-book" style="font-size:20px;" aria-hidden="true"></i> Tu biblioteca
            </div>
            <div class="lib-actions">
                <button class="icon-btn" aria-label="Agregar"><i class="fa fa-plus"></i></button>
                <button class="icon-btn" aria-label="Expandir"><i class="fa fa-arrow-right"></i></button>
            </div>
        </div>

        <div class="lib-filters">
            <span class="chip" role="button">Listas</span>
            <span class="chip" role="button">Artistas</span>
            <span class="chip" role="button">Álbumes</span>
        </div>

        <div class="lib-search-row">
            <i class="fa fa-magnifying-glass" style="cursor:pointer;" aria-hidden="true"></i>
            <span style="cursor:pointer;display:flex;align-items:center;gap:6px;">
                Recientes <i class="fa fa-list-ul" aria-hidden="true"></i>
            </span>
        </div>

        <div class="lib-list" id="libraryList" role="list">
            <!-- Generado por JS -->
        </div>
    </nav>

    <!-- ── MAIN CONTENT ── -->
    <main class="panel main-content" id="mainContent">
        <div class="main-header-chips">
            <span class="chip active" role="button">Todo</span>
            <span class="chip" role="button">Música</span>
            <span class="chip" role="button">Pódcasts</span>
        </div>

        <div class="recent-grid" id="recentGrid">
            <!-- Generado por JS -->
        </div>

        <div class="section-header">
            <h2>¡Hoy es viernes de novedades!</h2>
            <span class="show-all" role="button">Mostrar todos</span>
        </div>
        <div class="shelf-grid" id="novedadesGrid">
            <!-- Generado por JS -->
        </div>

        <div class="section-header">
            <div>
                <span style="font-size:13px;color:var(--text-sub);">Hecho para</span>
                <h2>Dereck xcx</h2>
            </div>
            <span class="show-all" role="button">Mostrar todos</span>
        </div>
        <div class="shelf-grid" id="hechoParaGrid">
            <!-- Generado por JS -->
        </div>
    </main>

    <!-- ── RIGHT SIDEBAR ── -->
    <aside class="panel right-sidebar" aria-label="Información de la canción">
        <div class="rs-header">
            <h3 id="rs-header-title">Charli xcx</h3>
            <div style="display:flex;gap:12px;color:var(--text-sub);">
                <i class="fa fa-ellipsis" style="cursor:pointer;" aria-hidden="true"></i>
                <i class="fa fa-xmark"    style="cursor:pointer;" aria-hidden="true"></i>
            </div>
        </div>

        <div class="rs-cover-wrapper">
            <img id="rs-cover" src="" alt="Portada" />
            <button class="btn-video-mode" id="btnVideoMode" style="display:none;" aria-label="Cambiar a video">
                <i class="fa fa-play" aria-hidden="true"></i> Cambiar a video
            </button>
        </div>

        <div class="rs-info-row">
            <div class="rs-text">
                <div class="rs-title"  id="rs-title">Título</div>
                <div class="rs-artist" id="rs-artist">Artista</div>
            </div>
            <div class="rs-actions">
                <i class="fa fa-arrow-up-from-bracket" title="Compartir"  aria-label="Compartir"></i>
                <i class="fa fa-circle-plus"           title="Agregar"    aria-label="Agregar a lista"></i>
            </div>
        </div>

        <div class="rs-related">Videos musicales relacionados</div>
        <div class="rs-related-grid">
            <div class="rs-rel-card" role="button" aria-label="SS26">
                <img src="https://res.cloudinary.com/df6ozlyhj/video/upload/v1783134716/Vondutchvide_zchpzs.jpg"
                     onerror="this.src='https://placehold.co/150x84/121212/ffffff?text=Video+1'"
                     alt="SS26" />
                <span>SS26</span>
            </div>
            <div class="rs-rel-card" role="button" aria-label="Rock Music">
                <img src="https://placehold.co/150x84/121212/ffffff?text=Video+2" alt="Rock Music" />
                <span>Rock Music</span>
            </div>
        </div>
    </aside>

    <!-- ── VIDEO OVERLAY ── -->
    <div id="video-overlay" class="video-overlay hidden" role="dialog" aria-label="Modo video">
        <video id="mainVideo" playsinline></video>
        <button class="btn-exit-video" id="btnAudioMode" aria-label="Volver a modo audio">
            <i class="fa fa-music" aria-hidden="true"></i> Cambiar a audio
        </button>
    </div>

    <!-- ── PLAYER BAR ── -->
    <footer class="player-bar" aria-label="Reproductor">
        <div class="pb-left">
            <img id="pb-cover" class="pb-cover" src="" alt="Portada" />
            <div class="pb-info">
                <div class="pb-title"  id="pb-title">Título</div>
                <div class="pb-artist" id="pb-artist">Artista</div>
            </div>
            <i class="fa fa-circle-plus pb-add" title="Agregar a lista" aria-label="Agregar a lista"></i>
        </div>

        <div class="pb-center">
            <div class="pb-controls">
                <button class="ctrl-btn" id="btnShuffle" aria-label="Aleatorio"><i class="fa fa-shuffle"></i></button>
                <button class="ctrl-btn" id="btnPrev"    aria-label="Anterior"> <i class="fa fa-backward-step"></i></button>
                <button class="ctrl-play" id="btnPlay"   aria-label="Play/Pausa">
                    <i class="fa fa-play" id="playIco"></i>
                </button>
                <button class="ctrl-btn" id="btnNext"    aria-label="Siguiente"><i class="fa fa-forward-step"></i></button>
                <button class="ctrl-btn" id="btnRepeat"  aria-label="Repetir">  <i class="fa fa-repeat"></i></button>
            </div>
            <div class="pb-progress">
                <span class="prog-time" id="time-current">0:00</span>
                <div class="prog-bar-container" id="prog-container" role="slider"
                     aria-label="Progreso" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                    <div class="prog-bar-bg">
                        <div class="prog-bar-fill" id="prog-fill">
                            <div class="prog-thumb"></div>
                        </div>
                    </div>
                </div>
                <span class="prog-time" id="time-total">0:00</span>
            </div>
        </div>

        <div class="pb-right">
            <button class="ctrl-btn" aria-label="Cola">
                <i class="fa fa-square-caret-right" style="color:var(--spotify-green);"></i>
            </button>
            <button class="ctrl-btn" aria-label="Letra"><i class="fa fa-microphone"></i></button>
            <button class="ctrl-btn" aria-label="Cola de reproducción"><i class="fa fa-list"></i></button>
            <button class="ctrl-btn" aria-label="Dispositivos"><i class="fa fa-mobile-screen"></i></button>
            <button class="ctrl-btn" aria-label="Volumen"><i class="fa fa-volume-low"></i></button>
            <div class="vol-container" id="vol-container" role="slider"
                 aria-label="Volumen" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80">
                <div class="prog-bar-bg">
                    <div class="prog-bar-fill" id="vol-fill" style="width:80%;">
                        <div class="prog-thumb"></div>
                    </div>
                </div>
            </div>
            <button class="ctrl-btn" aria-label="Pantalla completa"><i class="fa fa-expand"></i></button>
        </div>
    </footer>

    <audio id="audio" preload="auto"></audio>

    <script src="app.js"></script>
</body>
</html>
